apiVersion: machine.openshift.io/v1beta1
kind: MachineSet
metadata:
  annotations: {}
  name: $CLUSTERID-metal-odf-worker-eastus1
  generation: 1
  namespace: openshift-machine-api
  labels:
    machine.openshift.io/cluster-api-cluster: $CLUSTERID
    machine.openshift.io/cluster-api-machine-role: worker
    machine.openshift.io/cluster-api-machine-type: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      machine.openshift.io/cluster-api-cluster: $CLUSTERID
      machine.openshift.io/cluster-api-machineset: $CLUSTERID-metal-odf-worker-eastus1
  template:
    metadata:
      labels:
        machine.openshift.io/cluster-api-cluster: $CLUSTERID
        machine.openshift.io/cluster-api-machine-role: worker
        machine.openshift.io/cluster-api-machine-type: worker
        machine.openshift.io/cluster-api-machineset: $CLUSTERID-metal-odf-worker-eastus1
        node-role.kubernetes.io/worker: ""
        node-role.kubernetes.io/infra: ""
        node-role.kubernetes.io/storage: ""
        cluster.ocs.openshift.io/openshift-storage: ""
    spec:
      lifecycleHooks: {}
      metadata: 
        labels:
          node-role.kubernetes.io/worker: ""
          node-role.kubernetes.io/infra: ""
          node-role.kubernetes.io/storage: ""
          cluster.ocs.openshift.io/openshift-storage: ""
      providerSpec:
        value:
          osDisk:
            diskSettings: {}
            diskSizeGB: 400
            managedDisk:
              securityProfile:
                diskEncryptionSet: {}
              storageAccountType: Premium_LRS
            osType: Linux
          networkResourceGroup: $CLUSTERID-rg
          publicLoadBalancer: $CLUSTERID
          userDataSecret:
            name: worker-user-data
          vnet: $CLUSTERID-vnet
          securityProfile:
            settings: {}
          credentialsSecret:
            name: azure-cloud-credentials
            namespace: openshift-machine-api
          diagnostics:
          zone: '1'
          metadata: {}
          publicIP: false
          resourceGroup: $CLUSTERID-rg
          kind: AzureMachineProviderSpec
          location: eastus
          vmSize: Standard_D16as_v5
          image:
            offer: aro4
            publisher: azureopenshift
            resourceID: ''
            sku: 420-v2
            type: MarketplaceNoPlan
            version: 9.6.20251015
          acceleratedNetworking: true
          subnet: $CLUSTERID-worker-subnet
          apiVersion: machine.openshift.io/v1beta1
